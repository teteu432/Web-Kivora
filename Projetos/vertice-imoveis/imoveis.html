<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imóveis | Vértice Imóveis</title><meta name="description" content="Explore casas, apartamentos e oportunidades para comprar ou alugar."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/imoveis.css"></head><body>
<header class="header inner"><div class="container header-row"><a class="brand" href="index.html">Vértice<small>Imóveis</small></a><nav class="nav"><a href="index.html">Início</a><a href="imoveis.html?purpose=comprar">Comprar</a><a href="imoveis.html?purpose=alugar">Alugar</a><a href="imoveis.html">Imóveis</a><a href="contato.html">Contato</a><a class="btn btn-primary" data-whatsapp target="_blank">Fale com um corretor</a></nav><button class="menu-toggle" aria-label="Abrir menu">☰</button></div></header>
<main><section class="inner-hero"><div class="container"><span class="eyebrow">Catálogo</span><h1>Encontre seu próximo imóvel.</h1><p>Explore oportunidades selecionadas para comprar, alugar ou investir.</p></div></section>
<section class="filters-wrap"><div class="container"><form id="filtersForm" class="filters">
<div class="field"><label>Finalidade</label><select name="purpose"><option value="">Todas</option><option value="comprar">Comprar</option><option value="alugar">Alugar</option></select></div>
<div class="field"><label>Tipo</label><select name="type"><option value="">Todos</option><option>Casa</option><option>Apartamento</option><option>Sobrado</option><option>Terreno</option><option>Comercial</option></select></div>
<div class="field"><label>Cidade</label><select name="city"><option value="">Todas</option><option>Santo André</option><option>São Bernardo do Campo</option><option>São Caetano do Sul</option><option>Mauá</option><option>Ribeirão Pires</option></select></div>
<div class="field"><label>Bairro</label><input name="neighborhood" placeholder="Ex.: Jardim"></div>
<div class="field"><label>Preço mínimo</label><input name="minPrice" type="number" min="0" step="50000" placeholder="R$ 0"></div><div class="field"><label>Preço máximo</label><input name="maxPrice" type="number" min="0" step="50000" placeholder="Sem limite"></div>
<div class="field"><label>Quartos</label><select name="bedrooms"><option value="0">Qualquer</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div><div class="field"><label>Vagas</label><select name="parking"><option value="0">Qualquer</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select></div>
<div class="filters-actions"><button class="btn btn-outline" type="button" id="clearFilters">Limpar filtros</button><button class="btn btn-primary" type="submit">Aplicar filtros</button></div></form></div></section>
<section class="section"><div class="container"><div class="results-bar"><div><span class="eyebrow">Resultados</span><div id="resultsCount" class="results-count"></div></div><select id="sortProperties"><option value="relevant">Mais relevantes</option><option value="price-asc">Menor preço</option><option value="price-desc">Maior preço</option><option value="area-desc">Maior área</option><option value="new">Mais recentes</option></select></div><div id="propertiesGrid" class="properties-grid"></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="margin-top:0"><span>© 2026 Vértice Imóveis • Projeto demonstrativo</span><span>Desenvolvido por <a href="https://webkivora.com/" target="_blank">Web Kivora</a></span></div></div></footer><a class="whatsapp-float" data-whatsapp target="_blank">✆</a>
<script src="js/data.js" defer></script><script src="js/main.js" defer></script><script src="js/imoveis.js" defer></script></body></html>
